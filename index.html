<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Out Market Osaka</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
       text-align:center;padding:64px 20px;color:#222;background:#fff}
  p{font-size:16px;margin-bottom:28px}
  a{display:inline-block;padding:16px 32px;background:#1a73e8;color:#fff;
    border-radius:999px;text-decoration:none;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<p>ご来店ありがとうございます！<br>Googleの口コミページへ移動しています…</p>
<a id="go" href="https://search.google.com/local/writereview?placeid=ChIJk8ThbwDnAGARMwpM4e8rSfg">移動しない場合はこちら</a>

<script>
  const LOG_URL = 'https://script.google.com/macros/s/AKfycbyeUsLEOjB-k7-8oFjCVcPuftEP9K6_lWxRuq90L_JlnQPoW1CyqIeoRidY0qkNKwQx7Q/exec';
  const REVIEW_URL = 'https://search.google.com/local/writereview?placeid=ChIJk8ThbwDnAGARMwpM4e8rSfg';

  const id = new URLSearchParams(location.search).get('id') || '';
  if (id && LOG_URL.startsWith('https://')) {
    const u = LOG_URL + '?id=' + encodeURIComponent(id);
    let sent = false;
    try { sent = navigator.sendBeacon(u); } catch (e) {}
    if (!sent) { try { fetch(u, { method: 'POST', mode: 'no-cors', keepalive: true }); } catch (e) {} }
  }
  setTimeout(() => location.replace(REVIEW_URL), 400);
</script>
</body>
</html>
